# The expensive half: start the one machine that has the cache, build what the
# images ask for, put the artifacts somewhere, stop the machine.
#
# Gated deliberately. Every image here is checked on every commit by check.yml,
# which costs seconds; building is twenty minutes of a machine somebody pays
# for, so it happens when asked - a manual run, a tag, or the nightly schedule.
#
# Which images get built is not written here. The images say, and this asks:
#
#   silt images --ci build
#
# A list in this file would be right until someone adds an image and forgets.
#
# Authentication is Workload Identity Federation: GitHub signs a token saying
# which repository is asking, GCP is configured to trust that for this
# repository only, and mints an hour-long credential. There is no key in this
# repository to leak. See docs/CI.md.

name: build

on:
  workflow_dispatch:
    inputs:
      image:
        description: "one image path, or empty for everything marked (ci build)"
        required: false
        type: string
  push:
    tags: ["v*"]
  schedule:
    # 07:00 UTC, which is the small hours in US Eastern: a nightly that has
    # finished before anyone looks.
    - cron: "0 7 * * *"

permissions:
  contents: read
  id-token: write        # required for the OIDC token; without it, auth fails

env:
  PROJECT: buildroot-vh-c2
  ZONE: us-east1-b
  INSTANCE: br2-builder
  # CI logs in as "runner", which is the local username on a GitHub runner and
  # the account gcloud compute ssh created on the instance when the first run
  # failed inside it: "cd: /home/runner/silt: No such file or directory".
  #
  # The obvious fix - log in as the person who owns the clone - is the wrong
  # one. A job running as a person has that person's ssh private keys, their
  # gcloud credentials and everything else in their home. The people who can
  # put code in this job are not only this repository's owner: it runs three
  # third-party actions, and whoever controls their tags controls what
  # executes. So CI keeps the account with nothing worth stealing in it.
  CI_ROOT: /home/runner/ci
  # The store is the one thing worth sharing - keyed by content, and
  # twenty-seven gigabytes of warm trees - so it lives where neither home owns
  # it. Group siltbuild, setgid, umask 002; see docs/CI.md for the setup.
  SILT_STORE: /srv/silt
  BUCKET: gs://silt-images-353644819277
  # --tunnel-through-iap routes ssh over Identity-Aware Proxy instead of the
  # instance's external address, which is the answer when a firewall does not
  # allow 22 from a GitHub runner. It needs roles/iap.tunnelResourceAccessor
  # on the service account. Empty means a direct connection.
  SSH_FLAGS: ""
  # While the workflow is still being got right: leave the instance running
  # when a build fails, so the failure can be looked at. Set to false once
  # this is boring, or the 3am nightly will leave a machine on.
  KEEP_ON_FAILURE: "true"

concurrency:
  # One build at a time. The builder has a single work directory and a flock to
  # match; two runs would only queue behind each other on the machine, and the
  # second would look like a hang rather than a queue.
  group: br2-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/353644819277/locations/global/workloadIdentityPools/github/providers/silt
          service_account: silt-ci@buildroot-vh-c2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: start the builder
        run: |
          gcloud compute instances start "$INSTANCE" \
            --zone "$ZONE" --project "$PROJECT"

          # The instance is running before sshd is, so retry rather than sleep
          # a guessed number of seconds. The first attempt's output is kept:
          # an earlier version sent it to /dev/null and the job failed after
          # five and a half minutes saying only "did not become reachable",
          # which is the least useful sentence a five-minute wait can produce.
          echo "::group::first ssh attempt, with its output"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT" \
            --command "true" --quiet $SSH_FLAGS || true
          echo "::endgroup::"

          for i in $(seq 1 18); do
            if gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT" \
                 --command "true" --quiet $SSH_FLAGS >/dev/null 2>&1; then
              echo "reachable after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done

          echo "the builder did not become reachable in three minutes" >&2
          echo "the grouped output above is the actual error; usually one of:" >&2
          echo "  the service account cannot write ssh keys to project metadata" >&2
          echo "    -> roles/compute.osAdminLogin, or roles/compute.instanceAdmin.v1 at project level" >&2
          echo "  OS Login is enforced and the account lacks a login role" >&2
          echo "    -> roles/compute.osAdminLogin plus roles/iam.serviceAccountUser" >&2
          echo "  no firewall rule allows 22 from the runner's address" >&2
          echo "    -> set SSH_FLAGS to --tunnel-through-iap and grant roles/iap.tunnelResourceAccessor" >&2
          exit 1

      # The remote side is a script in the repository, not a string in this
      # file. Four runs failed on the string version - a tilde that expanded
      # to the wrong home, a PATH a non-interactive shell does not have, a
      # Buildroot tree in a directory this account cannot read - each one a
      # round trip to learn something a local shell says immediately. Shell
      # inside YAML inside an ssh argument is three levels of quoting and no
      # way to test any of it.
      - name: build
        run: |
          gcloud compute scp --zone "$ZONE" --project "$PROJECT" --quiet $SSH_FLAGS \
            ci/ci-build.sh "$INSTANCE":ci-build.sh
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT" --quiet $SSH_FLAGS \
            --command "chmod +x ci-build.sh && CI_ROOT='$CI_ROOT' SILT_STORE='$SILT_STORE' ./ci-build.sh ${{ github.sha }} ${{ inputs.image }}"

      # Two destinations, because they answer different questions. The bucket
      # is the archive: every image from every build, addressed by commit.
      # The run's artifacts are the convenience: click and download, no cloud
      # console and no credentials, which is what you want when someone asks
      # for an image and the answer should be a link.
      #
      # Artifacts have limits worth knowing: 2GB a file on the free plan, and
      # they expire. The appliance images are 120-160MB and fit easily; the
      # media and k3s ones are gigabytes and only go to the bucket.
      # Everything the builder produced, gathered on the builder and copied
      # down in one go. It writes nothing outward: the VM needs no cloud
      # permission at all, which is both simpler and safer, and it sidesteps a
      # failure that cost two runs - gcloud on the builder caches its access
      # token per user, so the "runner" account kept presenting a token minted
      # under the old read-only storage scope long after the scope was widened.
      #
      # Everything that leaves this machine leaves from the runner, using the
      # job's own short-lived WIF credential.
      - name: collect what was built
        run: |
          mkdir -p artifacts
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" --project "$PROJECT" --quiet $SSH_FLAGS \
            --command "set -e
              rm -rf ~/ci-artifacts && mkdir -p ~/ci-artifacts
              cd '$SILT_STORE/slots'
              # Oldest first, so that when two slots hold the same image - an
              # earlier build of it and today's - the newest is written last
              # and wins. The store is keyed by solution hash, so one image
              # built twice is two slots, and collecting them in glob order
              # would publish whichever hash sorted first.
              for s in \$(ls -dtr */); do
                [ -s \"\$s/artifacts\" ] || continue
                name=\$(sed -n 's/^image  *//p' \"\$s/manifest\" | head -1)
                mkdir -p ~/ci-artifacts/\"\$name\"
                # The images compress enormously - a rootfs is a mostly empty
                # filesystem - and every one of them is kept in the bucket
                # forever, so the saving compounds. It also shortens the copy
                # down, which matters more than the storage for a 2GB media
                # image. -T0 uses every core; the builder has plenty.
                while read -r a; do
                  # -f because an older slot for the same image may have
                  # written this file already; without it zstd refuses and the
                  # whole step fails after a successful build, which is how a
                  # 22-minute kernel build came to be thrown away twice.
                  [ -n \"\$a\" ] && zstd -q -f -3 -T0 \"\$s/\$a\" \
                    -o ~/ci-artifacts/\"\$name\"/\"\$a\".zst
                done < \"\$s/artifacts\"
                # The three small text files stay as they are: they are read
                # rather than written to a card, and a page that lists what an
                # image contains should not have to decompress anything first.
                cp \"\$s/defconfig\" \"\$s/predicted.config\" \"\$s/manifest\" ~/ci-artifacts/\"\$name\"/
                # How to use what was just compressed, beside it, because a
                # download is worthless if the reader has to guess.
                {
                  echo 'Each image here is zstd-compressed. To write one to a card:'
                  echo
                  echo '  zstd -dc sdcard.img.zst | sudo dd of=/dev/diskN bs=4m status=progress'
                  echo
                  echo 'or to decompress in place:'
                  echo
                  echo '  zstd -d sdcard.img.zst'
                  echo
                  echo 'zstd: brew install zstd, apt install zstd, dnf install zstd.'
                  echo
                  echo 'A QEMU image is a kernel and a filesystem rather than a card image:'
                  echo
                  echo '  zstd -d Image.zst rootfs.ext4.zst'
                  echo '  qemu-system-aarch64 -M virt -cpu cortex-a53 -m 512 -nographic \\'
                  echo '    -kernel Image -drive file=rootfs.ext4,if=none,id=hd,format=raw \\'
                  echo '    -device virtio-blk-device,drive=hd \\'
                  echo '    -append \"root=/dev/vda rootwait console=ttyAMA0\"'
                } > ~/ci-artifacts/\"\$name\"/README.txt
              done
              du -sh ~/ci-artifacts/*"
          gcloud compute scp --recurse --zone "$ZONE" --project "$PROJECT" --quiet $SSH_FLAGS \
            "$INSTANCE":~/ci-artifacts/. artifacts/
          du -sh artifacts/*

      # The archive, addressed by commit, written from here rather than from
      # the builder. A download page can be built over this later; artifacts
      # expire, a bucket does not.
      - name: publish to the bucket
        run: |
          gcloud storage cp --recursive --quiet \
            artifacts/* "$BUCKET/${{ github.sha }}/"
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          gcloud storage ls -r "$BUCKET/${{ github.sha }}/**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Artifacts are capped at 2GB a file, so anything larger is dropped from
      # the upload and lives only in the bucket. Compressed, an appliance image
      # is tens of megabytes and nothing comes close to the cap; the check
      # stays for the day something does.
      - name: drop anything too large for an artifact
        run: |
          find artifacts -type f -size +1800M -print -delete || true

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      # Stop the machine when the build worked, and leave it running when it
      # did not.
      #
      # This was if: always(), which is right for cost and wrong for
      # debugging: every failed run shut down the instance somebody was on,
      # and the next attempt paid a minute to start it again and lost whatever
      # state the failure had left behind. A failed build is exactly when you
      # want to log in and look.
      #
      # The cost of that is a machine left running after a failure nobody is
      # watching - the 3am nightly, say - so KEEP_ON_FAILURE is here to be
      # turned off once the workflow is boring. Until then the watchdog in
      # docs/CI.md is the backstop, and "gcloud compute instances stop" is one
      # command away.
      - name: stop the builder
        if: success() || env.KEEP_ON_FAILURE != 'true'
        run: |
          gcloud compute instances stop "$INSTANCE" \
            --zone "$ZONE" --project "$PROJECT" --quiet

      - name: left running for inspection
        if: failure() && env.KEEP_ON_FAILURE == 'true'
        run: |
          echo "the build failed and $INSTANCE is still running, so you can look:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gcloud compute ssh $INSTANCE --zone $ZONE --project $PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo "gcloud compute instances stop $INSTANCE --zone $ZONE --project $PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
