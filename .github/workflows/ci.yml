name: ci

on:
  push:
  pull_request:
  # The full sweep imports and round-trips every defconfig Buildroot ships.
  # Too slow for every push; weekly and on demand.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  # Every fragment claim is only meaningful for the release it was checked
  # against. This must match the (verified-against ...) pins in images/.
  BUILDROOT_VERSION: "2025.02.16"
  # Only the Kconfig files are needed to check CONFIG_* claims, so the kernel
  # is fetched as a tarball and unpacked selectively: 37 MB, not a clone.
  LINUX_VERSION: "v6.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

      - name: cache buildroot
        id: br-cache
        uses: actions/cache@v4
        with:
          path: buildroot
          key: buildroot-${{ env.BUILDROOT_VERSION }}

      - name: fetch buildroot
        if: steps.br-cache.outputs.cache-hit != 'true'
        run: >
          git clone --depth 1 --branch "$BUILDROOT_VERSION"
          https://github.com/buildroot/buildroot.git buildroot

      # The real-tree tests are where every importer bug so far was found.
      - name: real-tree tests
        run: SILT_BUILDROOT="$PWD/buildroot" go test ./...

      # Buildroot's own kconfig is the oracle for import: these compose
      # imported boards with each other and with the library's profiles and
      # check kbuild keeps every stated line. Needs make and a C compiler,
      # both present on the runner.
      - name: kbuild experiments
        run: >
          SILT_BUILDROOT="$PWD/buildroot" SILT_KBUILD=1
          go test ./importer ./fixpoint -v -timeout 30m
          -run 'TestFactoring|TestImportedTargetsTakeLibraryProfiles|TestModelAcceptsEveryDefconfig|TestLibraryImagesAgainstKbuild'

      # The evaluator against Buildroot's own conf: the synthetic cases
      # through the conf binary, and a sample of real and perturbed
      # defconfigs through make. The full 290 run weekly.
      - name: kconfig evaluator against conf
        run: |
          mkdir -p kbo
          make -s -C buildroot O="$PWD/kbo" defconfig
          SILT_KCONF="$PWD/kbo/build/buildroot-config/conf" go test ./kconfig -run Evaluate
          SILT_BUILDROOT="$PWD/buildroot" SILT_KBUILD=1 SILT_KBUILD_OUT="$PWD/kbo" SILT_FUZZ=20 \
            SILT_DEFCONFIGS="qemu_aarch64_virt odroidc2 raspberrypi4_64 pine64 acmesystems_aria_g25_128mb at91sam9x5ek_dev beaglebone qemu_x86_64 qemu_riscv64_virt aarch64_efi" \
            go test ./kconfig -v -run MatchesKbuild

      - name: cache linux Kconfig
        id: lx-cache
        uses: actions/cache@v4
        with:
          path: linux
          key: linux-kconfig-${{ env.LINUX_VERSION }}

      - name: fetch linux Kconfig
        if: steps.lx-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o linux.tar.gz \
            "https://codeload.github.com/torvalds/linux/tar.gz/refs/tags/$LINUX_VERSION"
          mkdir -p linux.tmp
          # scripts/ and the arch configs as well, so the kernel's own conf
          # can be built and used as the oracle for the evaluator.
          tar xzf linux.tar.gz -C linux.tmp --wildcards '*/Kconfig*' '*/Makefile' \
            '*/scripts/*' '*/arch/arm64/configs/*'
          mv linux.tmp/linux-* linux
          rm -rf linux.tar.gz linux.tmp

      - name: check CONFIG_* claims against the kernel
        run: SILT_LINUX="$PWD/linux" go test ./verify -v -run Linux

      - name: evaluator against the kernel's own conf
        run: SILT_LINUX="$PWD/linux" SILT_KBUILD=1 go test ./kconfig -v -run KernelConf

      - name: build silt
        run: go build -o bin/silt ./cmd/silt

      - name: check images against buildroot and the kernel
        run: ci/check-images.sh "$PWD/buildroot" bin/silt "$PWD/linux"

  every-defconfig:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fetch buildroot
        run: >
          git clone --depth 1 --branch "$BUILDROOT_VERSION"
          https://github.com/buildroot/buildroot.git buildroot
      - name: evaluator against kbuild on every shipped defconfig
        run: >
          SILT_BUILDROOT="$PWD/buildroot" SILT_KBUILD=1 SILT_FUZZ=100
          go test ./kconfig -v -timeout 60m -run MatchesKbuild
      - name: round-trip every shipped defconfig
        run: >
          SILT_BUILDROOT="$PWD/buildroot" SILT_KBUILD=1
          go test ./importer -v -timeout 110m -run TestEveryDefconfigRoundTrips
