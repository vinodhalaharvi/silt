# Everything that is cheap, on every commit.
#
# No VM starts here and nothing is built. This job composes every image,
# predicts the .config each would become, and verifies every stated symbol
# against Buildroot's own Kconfig - which is seventeen seconds for fifty-five
# images and catches the class of bug that otherwise surfaces forty minutes
# into a build on a board nobody has tried.
#
# The expensive work is in build.yml, gated, and will not run if this fails.

name: check

on:
  push:
  pull_request:

env:
  BUILDROOT_REF: "2025.02.16"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build and test
        run: |
          go build -o bin/silt ./cmd/silt
          go test ./...

      # Canonical form is what makes hashing meaningful: two files that differ
      # only in whitespace must hash the same, so the formatter is checked
      # rather than suggested.
      - name: fmt
        run: ./bin/silt fmt --check .

      # silt check needs a real Buildroot tree, because the claims it verifies
      # are claims about that tree's Kconfig - not about Buildroot in general.
      # A shallow clone of the pinned tag is enough and caches well.
      - name: buildroot
        uses: actions/cache@v4
        id: br-cache
        with:
          path: buildroot
          key: buildroot-${{ env.BUILDROOT_REF }}

      - if: steps.br-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$BUILDROOT_REF" \
            https://gitlab.com/buildroot.org/buildroot.git buildroot

      - name: check every image against the tree
        run: ./bin/silt check --buildroot buildroot

      # What CI would build, printed rather than built, so a pull request that
      # marks an image (ci build) shows what it just signed the machine up for.
      - name: what is marked for building
        run: |
          {
            echo "### Images marked for CI"
            echo
            echo '```'
            ./bin/silt images --ci build
            ./bin/silt images --ci boot
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
