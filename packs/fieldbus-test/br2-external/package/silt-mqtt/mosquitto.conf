# The bench broker for the simulated device.
#
# mosquitto 2.0 listens on localhost only unless a listener says otherwise,
# so without this a subscriber on a laptop is refused while one on the board
# works, which is a confusing way to spend an evening.
#
# Anonymous, like the rest of this device. Lab networks only.

listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_dest stderr
