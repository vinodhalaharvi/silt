# The board's web root: the landing page, the recordings directory and the
# .sdp file. The live MJPEG stream is not here - it is a long-lived response
# rather than a file, so it has its own port (8090) served by silt-media.

server.document-root = "/var/www"
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.errorlog      = "/var/log/lighttpd-error.log"

index-file.names     = ( "index.html" )
dir-listing.activate = "enable"
mimetype.assign      = (
  ".html" => "text/html",
  ".jpg"  => "image/jpeg",
  ".mp4"  => "video/mp4",
  ".sdp"  => "application/sdp",
  ".txt"  => "text/plain",
  ""      => "application/octet-stream"
)
