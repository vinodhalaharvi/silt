# Time, on a board that has no clock.
#
# A Raspberry Pi has no RTC: every boot starts at 1 January 1970, and every
# TLS handshake then fails, because a certificate issued in 2026 is "not yet
# valid" to a machine that thinks it is 1970. tailscaled reports it as
#
#   x509: certificate has expired or is not yet valid:
#   current time 1970-01-01T00:02:18Z is before 2026-08-03T05:43:45Z
#
# which reads like a certificate problem and is a clock problem.

pool pool.ntp.org iburst

# The line that matters here. chrony's default is to slew small offsets and
# refuse large ones, which is right for a machine whose clock is roughly
# correct and useless for one that is fifty-six years out. "1 -1" means step
# the clock whenever the offset exceeds a second, with no limit on how often
# or how far - the only policy that works without an RTC.
makestep 1 -1

driftfile /var/lib/chrony/chrony.drift
rtcsync
